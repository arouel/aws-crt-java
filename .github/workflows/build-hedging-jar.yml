name: Build hedging jar

# Builds an aws-crt jar from this branch, which uses aws-c-s3 with GET hedging
# (awslabs/aws-c-s3#736). The upstream CI workflows need AWS credentials of the
# CRT team, so they cannot run on a fork. This workflow uses the build commands
# of codebuild/cd/ and needs no AWS access.
#
# The workflow builds only the Linux libraries, because GitHub gave it no macOS
# arm64 runner. utils/build-hedging-jar.sh builds the jar with the Linux
# libraries of a run and a macOS arm64 library on a Mac.

on:
  workflow_dispatch:
  push:
    branches:
      - get-object-hedging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRT_VERSION: 0.50.2-hedging.2

jobs:
  native:
    name: Native library (${{ matrix.classifier }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            classifier: linux-x86_64
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch_64
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: maven

      - name: Set up Python for the aws-c-s3 mock server
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          missing=()
          command -v mvn > /dev/null || missing+=(maven)
          command -v cmake > /dev/null || missing+=(cmake)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          mvn -v
          cmake --version

      - name: Set the version
        run: mvn -B versions:set -DnewVersion="$CRT_VERSION" -DgenerateBackupPoms=false

      - name: Build the native library and the platform jar
        run: mvn -B package -DskipTests -Dcrt.classifier=${{ matrix.classifier }}

      - name: Check that the native library contains GET hedging
        run: |
          libs=$(find target/cmake-build/lib -type f -name '*.so')
          echo "$libs"
          test "$(echo "$libs" | wc -l)" -eq 1
          grep -q -a AWS_CRT_S3_GET_OBJECT_HEDGING $libs

      - name: Load the native library
        run: |
          cat > "$RUNNER_TEMP/Smoke.java" <<'EOF'
          import software.amazon.awssdk.crt.CRT;

          public class Smoke {
              public static void main(String[] args) {
                  CRT.checkLoaded();
                  System.out.println(CRT.getOSIdentifier() + "-" + CRT.getArchIdentifier() + ": " + CRT.awsErrorName(2092));
              }
          }
          EOF
          java -cp "target/aws-crt-$CRT_VERSION-${{ matrix.classifier }}.jar" "$RUNNER_TEMP/Smoke.java"

      - name: Start the aws-c-s3 mock server
        run: |
          python -m pip install --quiet h11 trio
          nohup python crt/aws-c-s3/tests/mock_s3_server/mock_s3_server.py > "$RUNNER_TEMP/mock_s3_server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mock_s3_server.log"
          exit 1

      - name: Test GET hedging against the mock server
        run: >-
          mvn -B test -Dshared-lib.skip=true
          -Dtest=S3ClientGetObjectHedgingTest
          -Daws.crt.s3.mock_server=http://localhost:8080

      - name: Show the mock server log
        if: failure()
        run: cat "$RUNNER_TEMP/mock_s3_server.log" || true

      - name: Upload the native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.classifier }}
          path: target/cmake-build/lib/**/*.so
          if-no-files-found: error
          retention-days: 7

  jar:
    name: Jar with the Linux libraries
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: maven

      - name: Download the native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: target/cmake-build/lib
          merge-multiple: true

      - name: Check the native libraries
        run: |
          find target/cmake-build/lib -type f | sort
          for lib in linux/x86_64/glibc/libaws-crt-jni.so linux/armv8/glibc/libaws-crt-jni.so; do
            if [ ! -f "target/cmake-build/lib/$lib" ]; then
              echo "::error::The Linux library $lib is missing."
              exit 1
            fi
          done

      - name: Set the version
        run: mvn -B versions:set -DnewVersion="$CRT_VERSION" -DgenerateBackupPoms=false

      - name: Build the jar and the sources jar
        run: >-
          mvn -B package org.apache.maven.plugins:maven-source-plugin:3.4.0:jar-no-fork
          -DskipTests -Dshared-lib.skip=true

      - name: Check the jar and the sources jar
        run: |
          listing=$(unzip -l "target/aws-crt-$CRT_VERSION.jar")
          grep -E 'libaws-crt-jni\.so$' <<< "$listing"
          for lib in linux/x86_64/glibc/libaws-crt-jni.so linux/armv8/glibc/libaws-crt-jni.so; do
            grep -q -F "$lib" <<< "$listing"
          done
          options_source=$(unzip -p "target/aws-crt-$CRT_VERSION-sources.jar" software/amazon/awssdk/crt/s3/S3ClientOptions.java)
          grep -q withGetObjectHedging <<< "$options_source"

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: aws-crt-${{ env.CRT_VERSION }}-linux
          path: |
            target/aws-crt-${{ env.CRT_VERSION }}.jar
            target/aws-crt-${{ env.CRT_VERSION }}-sources.jar
            pom.xml
          if-no-files-found: error
